[project]
name = "onboarding"
version = "0.1.0"
description = "Customer Onboarding Assistant implemented three ways: Microsoft Agent Framework, LangChain, LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic[email]>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "typer>=0.15,<1",
    "rich>=13.9,<15",
    "python-dotenv>=1.0,<2",
    # --- Microsoft Agent Framework ---
    # Deliberately NOT the `agent-framework` meta-package: it pulls ~30 provider
    # packages (azure, bedrock, gemini, devui, ...). core + openai is the same
    # `agent_framework` import namespace and the same 1.13 API.
    "agent-framework-core==1.13.0",
    "agent-framework-openai>=1.12,<2",
    # --- LangChain / LangGraph ---
    "langchain>=1.3,<2",
    "langchain-openai>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    # --- PII (free / local) ---
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy>=3.8,<4",
    "aiosqlite>=0.22.1",
    "filelock>=3.32.2",
]

[project.optional-dependencies]
# The spaCy model is not on PyPI; it ships as a GitHub release wheel. Without it
# the PII engine falls back to regex-only recognizers (see core/pii.py) — masking
# still works, only NER-based detection in free text is lost.
nlp = [
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
onboarding = "onboarding.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The spaCy model in the `nlp` extra is a direct URL (GitHub release wheel).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: requires a live OpenAI-compatible endpoint (Ollama or Anthropic)",
]
addopts = "-m 'not llm' --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

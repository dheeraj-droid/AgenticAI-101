<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Onboarding Assistant</title>
<style>
/* ---------------------------------------------------------------------------
   Tokens
   --------------------------------------------------------------------------- */
:root {
  --bg:        #fbfbfa;
  --surface:   #ffffff;
  --sunken:    #f4f4f2;
  --line:      #e5e4e0;
  --line-soft: #eeedea;
  --text:      #1a1a19;
  --text-2:    #6b6a66;
  --text-3:    #97958f;
  --accent:    #2f6fed;
  --accent-fg: #ffffff;
  --good:      #1f8a54;
  --warn:      #a8710e;
  --bad:       #c0392f;
  --good-bg:   #eaf6ef;
  --warn-bg:   #fdf5e6;
  --bad-bg:    #fcefee;

  --r-sm: 6px;
  --r:    9px;
  --r-lg: 13px;

  /* Custom curves — the built-in CSS easings are too weak to feel intentional. */
  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #131315;
    --surface:   #1a1a1d;
    --sunken:    #202024;
    --line:      #2b2b30;
    --line-soft: #232327;
    --text:      #ececf0;
    --text-2:    #9d9da6;
    --text-3:    #6e6e78;
    --accent:    #6d9dff;
    --accent-fg: #10121a;
    --good:      #56d195;
    --warn:      #e8b562;
    --bad:       #f08e86;
    --good-bg:   #17281f;
    --warn-bg:   #2a2218;
    --bad-bg:    #2c1d1c;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------------------
   Header
   --------------------------------------------------------------------------- */
header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
#status { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

/* ---------------------------------------------------------------------------
   Layout
   --------------------------------------------------------------------------- */
main {
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr);
  gap: 24px;
  padding: 24px;
  max-width: 1360px;
  margin: 0 auto;
  align-items: start;
}
@media (max-width: 920px) { main { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
}
.panel > .body { padding: 18px; }

.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-3); margin: 0 0 12px;
}

/* ---------------------------------------------------------------------------
   Form
   --------------------------------------------------------------------------- */
label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text-2); margin: 14px 0 5px;
}
label:first-of-type { margin-top: 0; }
label .hint { font-weight: 400; color: var(--text-3); }

input, select, textarea {
  width: 100%; padding: 8px 10px;
  font: inherit; font-size: 14px;
  color: var(--text); background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
textarea { resize: vertical; min-height: 62px; }
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.pair label { margin-top: 0; }

button {
  font: inherit; font-weight: 550; cursor: pointer;
  border: 1px solid transparent; border-radius: var(--r-sm);
  transition: transform 160ms var(--ease-out), background-color 140ms ease, opacity 140ms ease;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.55; cursor: default; transform: none; }

.primary {
  width: 100%; margin-top: 20px; padding: 10px;
  background: var(--accent); color: var(--accent-fg);
}
@media (hover: hover) and (pointer: fine) {
  .primary:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 88%, black); }
}

/* ---------------------------------------------------------------------------
   Tabs — one per framework.
   The active styling lives on a duplicated, clipped copy of the tab strip, so
   the colour change travels with the indicator instead of cross-fading. Timing
   individual colour transitions can never look this clean.
   --------------------------------------------------------------------------- */
.tabs {
  position: relative;
  display: flex;
  padding: 4px;
  gap: 2px;
  background: var(--sunken);
  border-bottom: 1px solid var(--line);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  isolation: isolate;
}
.tab {
  flex: 1;
  position: relative;
  padding: 9px 8px 10px;
  background: none;
  border-radius: var(--r-sm);
  color: var(--text-2);
  font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color 140ms ease, transform 160ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .tab:hover { color: var(--text); }
}
.tab:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
/* Small dot: this framework has produced a result. */
.tab .dot {
  display: inline-block; width: 5px; height: 5px; margin-left: 6px;
  border-radius: 50%; background: currentColor;
  opacity: 0; transform: scale(0.6);
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
  vertical-align: middle;
}
.tab[data-ran="true"] .dot { opacity: 0.5; transform: scale(1); }

.tabs-active {
  position: absolute; inset: 4px;
  display: flex; gap: 2px;
  pointer-events: none;
  clip-path: inset(0 100% 0 0 round var(--r-sm));
  transition: clip-path 260ms var(--ease-out);
  z-index: 1;
}
.tabs-active .tab {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 0 0 1px var(--line-soft);
}
.tabs-active .tab[data-ran="true"] .dot { opacity: 0.45; transform: scale(1); }

/* ---------------------------------------------------------------------------
   Stats strip
   --------------------------------------------------------------------------- */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; margin-bottom: 24px;
}
.stat { background: var(--surface); padding: 12px 14px; }
.stat .n {
  font-size: 21px; font-weight: 600; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; line-height: 1.2;
}
.stat .k {
  font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3); margin-top: 2px;
}
.stat.zero .n { color: var(--text-3); }

/* ---------------------------------------------------------------------------
   Trace — what this framework actually executed
   --------------------------------------------------------------------------- */
.trace { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.step {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 4px 9px; border-radius: var(--r-sm);
  background: var(--sunken); border: 1px solid var(--line-soft);
  font: 12px/1.5 var(--mono);
}
.step .kind {
  font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
}
.step[data-kind="tool"]     { background: var(--good-bg); border-color: transparent; color: var(--good); }
.step[data-kind="agent"]    { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.step[data-kind="task"]     { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.step[data-kind="tool"] .kind,
.step[data-kind="agent"] .kind,
.step[data-kind="task"] .kind { color: inherit; opacity: 0.7; }
.arrow { color: var(--text-3); font-size: 11px; }
.trace-note { font-size: 12px; color: var(--text-3); margin-top: 10px; }

/* ---------------------------------------------------------------------------
   Result
   --------------------------------------------------------------------------- */
#panelbody { padding: 18px; }

.verdict { display: flex; align-items: flex-start; gap: 11px; }
.verdict .mark {
  flex: none; width: 20px; height: 20px; margin-top: 1px;
  border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
}
.verdict h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.verdict .sub { color: var(--text-2); font-size: 13px; margin-top: 3px; }

[data-outcome="registered"] .mark { background: var(--good-bg); color: var(--good); }
[data-outcome="registered"] h2   { color: var(--good); }
[data-outcome="duplicate"]  .mark { background: var(--warn-bg); color: var(--warn); }
[data-outcome="duplicate"]  h2   { color: var(--warn); }
[data-outcome="blocked"]    .mark { background: var(--bad-bg); color: var(--bad); }
[data-outcome="blocked"]    h2   { color: var(--bad); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip {
  font-size: 11.5px; padding: 3px 8px; border-radius: 999px;
  background: var(--sunken); color: var(--text-2);
  border: 1px solid var(--line-soft);
}
.chip.alert { background: var(--bad-bg); color: var(--bad); border-color: transparent; }

.section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.section > h3 {
  margin: 0 0 10px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3);
}

ul.plain { margin: 0; padding: 0; list-style: none; }
ul.plain li { padding: 3px 0; font-size: 13.5px; }
ul.plain li + li { border-top: 1px solid var(--line-soft); }
.muted { color: var(--text-2); }
.sev {
  display: inline-block; min-width: 58px; margin-right: 9px;
  font: 10.5px/1.7 var(--mono); text-transform: uppercase; letter-spacing: 0.05em;
  text-align: center; border-radius: var(--r-sm); vertical-align: 1px;
}
.sev.error   { background: var(--bad-bg);  color: var(--bad); }
.sev.warning { background: var(--warn-bg); color: var(--warn); }
.sev.info    { background: var(--sunken);  color: var(--text-3); }
.code { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); }
.tick { font-family: var(--mono); color: var(--text-3); margin-right: 7px; }
.tick.done { color: var(--good); }

.mail + .mail { margin-top: 10px; }
.mail summary {
  cursor: pointer; list-style: none; padding: 9px 11px;
  background: var(--sunken); border: 1px solid var(--line-soft);
  border-radius: var(--r); font-size: 13.5px;
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  transition: background-color 140ms ease;
}
.mail summary::-webkit-details-marker { display: none; }
@media (hover: hover) and (pointer: fine) { .mail summary:hover { background: var(--line-soft); } }
.mail summary .who { color: var(--text-3); font-size: 12px; }
.mail summary .flag { margin-left: auto; font-size: 11.5px; font-weight: 600; }
.mail .flag.yes { color: var(--good); }
.mail .flag.no  { color: var(--warn); }
.mail pre {
  margin: 0; padding: 12px 13px;
  border: 1px solid var(--line-soft); border-top: 0;
  border-radius: 0 0 var(--r) var(--r);
  background: var(--surface);
  font: 12.5px/1.55 var(--mono);
  white-space: pre-wrap; word-wrap: break-word;
  color: var(--text-2);
  max-height: 300px; overflow-y: auto;
}
.mail[open] summary { border-radius: var(--r) var(--r) 0 0; }
.mail .why { font-size: 12px; color: var(--text-3); padding: 7px 11px 0; }

/* ---------------------------------------------------------------------------
   Chat
   --------------------------------------------------------------------------- */
#log { max-height: 300px; overflow-y: auto; }
.turn + .turn { margin-top: 14px; }
.turn .q { font-weight: 550; font-size: 13.5px; }
.turn .a { white-space: pre-wrap; font-size: 13.5px; margin-top: 3px; }
.turn .tools {
  font: 11px/1.4 var(--mono); color: var(--text-3); margin-top: 5px;
}
.ask { display: flex; gap: 8px; margin-top: 14px; }
.ask input { flex: 1; }
.ask button { padding: 8px 16px; background: var(--sunken); color: var(--text); border-color: var(--line); }

.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.suggest button {
  padding: 4px 9px; font-size: 12px; border-radius: 999px;
  background: none; border: 1px dashed var(--line); color: var(--text-2);
}
@media (hover: hover) and (pointer: fine) {
  .suggest button:hover { border-style: solid; color: var(--text); }
}

/* ---------------------------------------------------------------------------
   Empty / error / status
   --------------------------------------------------------------------------- */
.empty { color: var(--text-2); font-size: 13.5px; }
.empty strong { color: var(--text); font-weight: 550; }
.err { color: var(--bad); font-size: 13px; margin-top: 12px; white-space: pre-wrap; }
.pill {
  font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
  background: var(--sunken); border: 1px solid var(--line-soft); color: var(--text-2);
}
.pill.on  { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.off { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

.spinner {
  display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
  border: 2px solid color-mix(in srgb, currentColor 25%, transparent);
  border-top-color: currentColor; border-radius: 50%;
  /* Fast — a quicker spinner makes the same wait feel shorter. */
  animation: spin 600ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Entrance: a short stagger reads as one cascade rather than a pop. */
.enter { animation: rise 260ms var(--ease-out) both; }
.enter:nth-child(2) { animation-delay: 40ms; }
.enter:nth-child(3) { animation-delay: 80ms; }
.enter:nth-child(4) { animation-delay: 120ms; }
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  /* Fewer and gentler, not zero: keep opacity, drop the movement. */
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
  }
  .enter { animation: fade 200ms ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .spinner { animation: spin 900ms linear infinite !important; }
}
</style>
</head>
<body>

<header>
  <h1>Customer Onboarding Assistant</h1>
  <div id="status"><span class="pill">checking…</span></div>
</header>

<main>
  <!-- ------------------------------------------------------------------ -->
  <div style="grid-column: 1 / -1"><div class="stats" id="stats"></div></div>

  <section class="panel">
    <div class="body">
      <p class="eyebrow">New customer</p>
      <form id="form" autocomplete="off">
        <label for="company_name">Company</label>
        <input id="company_name" name="company_name" required value="Northwind Trading">

        <label for="full_name">Contact</label>
        <input id="full_name" name="full_name" required value="Ada Lovelace">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required value="ada@northwind.example">

        <label for="phone">Phone <span class="hint">— never shown to the model</span></label>
        <input id="phone" name="phone" value="+44 20 7946 0142">

        <div class="pair">
          <div>
            <label for="plan">Plan</label>
            <select id="plan" name="plan">
              <option>free</option><option selected>pro</option><option>pro+</option>
            </select>
          </div>
          <div>
            <label for="region">Region</label>
            <select id="region" name="region">
              <option>us</option><option>eu</option><option>apac</option><option>other</option>
            </select>
          </div>
        </div>

        <div class="pair">
          <div>
            <label for="annual_contract_value_usd">Value (USD)</label>
            <input id="annual_contract_value_usd" name="annual_contract_value_usd" value="12000">
          </div>
          <div>
            <label for="term_months">Term (months)</label>
            <input id="term_months" name="term_months" value="12">
          </div>
        </div>

        <label for="products">Products <span class="hint">— comma separated</span></label>
        <input id="products" name="products" value="core, analytics">

        <label for="signup_notes">Signup notes</label>
        <textarea id="signup_notes" name="signup_notes">Wants to be live before the end of the quarter.</textarea>

        <button class="primary" id="submit" type="submit">Onboard</button>
        <div id="form-error" class="err"></div>
      </form>
    </div>
  </section>

  <!-- ------------------------------------------------------------------ -->
  <section class="panel">
    <div class="tabs" id="tabs" role="tablist" aria-label="Agent framework"></div>
    <div id="panelbody"></div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let config = null;
let active = "langgraph";
/** Per-framework state, so switching tabs compares runs instead of losing them. */
const tabs = new Map();

function state(id) {
  if (!tabs.has(id)) tabs.set(id, { result: null, session: null, turns: [], busy: false, error: "" });
  return tabs.get(id);
}

async function api(path, body) {
  const response = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = data.detail;
    throw new Error(typeof detail === "string" ? detail
      : Array.isArray(detail) ? detail.map((d) => d.msg || JSON.stringify(d)).join("; ")
      : response.statusText);
  }
  return data;
}

/* --- boot ---------------------------------------------------------------- */

async function boot() {
  config = await api("/api/config");
  if (!config.frameworks.some((f) => f.id === active)) active = config.frameworks[0].id;
  renderStatus();
  renderTabs();
  renderPanel();
  refreshStats();
}

/** The registry at a glance. Every number is counted server-side. */
async function refreshStats() {
  let stats;
  try { stats = await api("/api/stats"); } catch { return; }
  const cells = [
    { n: stats.customers, k: "customers" },
    ...stats.by_plan.map((p) => ({ n: p.count, k: `on ${p.plan}` })),
    { n: `${stats.tasks_completed}/${stats.tasks_total}`, k: "tasks done",
      zero: stats.tasks_total === 0 },
  ];
  $("stats").innerHTML = cells.map((c) => `
    <div class="stat${c.zero || c.n === 0 ? " zero" : ""}">
      <div class="n">${esc(c.n)}</div><div class="k">${esc(c.k)}</div>
    </div>`).join("");
  $("stats").title = `Registry: ${stats.registry_path}`;
}

function renderStatus() {
  const bits = [];
  bits.push(config.llm.configured
    ? `<span class="pill on">${esc(config.llm.model)}</span>`
    : `<span class="pill off">no model configured</span>`);

  const mail = config.mail;
  if (mail.sending && mail.approved_recipients.includes("*")) {
    // Amber, not green: whatever is typed into the form receives real mail.
    bits.push(`<span class="pill off" title="ONBOARDING_ALLOWED_RECIPIENTS=*">`
      + `sending to any address</span>`);
  } else if (mail.sending) {
    const n = mail.approved_recipients.length;
    bits.push(`<span class="pill on" title="${esc(mail.approved_recipients.join(", "))}">`
      + `sending to ${n} approved address${n === 1 ? "" : "es"}</span>`);
  } else {
    bits.push(`<span class="pill">outbox only</span>`);
  }
  $("status").innerHTML = bits.join("");
}

/* --- tabs ---------------------------------------------------------------- */

function tabMarkup() {
  return config.frameworks.map((f) => `
    <button class="tab" role="tab" type="button" data-id="${esc(f.id)}"
            data-ran="${state(f.id).result ? "true" : "false"}"
            aria-selected="${f.id === active}" tabindex="${f.id === active ? "0" : "-1"}"
            title="${esc(f.full_name)} — ${esc(f.note)}">${esc(f.label)}<span class="dot"></span></button>`).join("");
}

function renderTabs() {
  $("tabs").innerHTML = `${tabMarkup()}<div class="tabs-active" aria-hidden="true">${tabMarkup()}</div>`;
  $("tabs").querySelectorAll(".tabs-active .tab").forEach((t) => t.setAttribute("tabindex", "-1"));
  moveIndicator();
}

/** Clip the duplicated strip down to just the active tab. */
function moveIndicator() {
  const strip = $("tabs").querySelector(".tabs-active");
  const buttons = [...$("tabs").children].filter((el) => el.classList.contains("tab"));
  const index = config.frameworks.findIndex((f) => f.id === active);
  const target = buttons[index];
  if (!strip || !target) return;
  const left = target.offsetLeft - 4;              // strip is inset by 4px
  const right = strip.offsetWidth - left - target.offsetWidth;
  strip.style.clipPath = `inset(0 ${Math.max(0, right)}px 0 ${Math.max(0, left)}px round var(--r-sm))`;
}

function selectTab(id) {
  if (id === active) return;
  active = id;
  renderTabs();
  renderPanel();
}

$("tabs").addEventListener("click", (event) => {
  const tab = event.target.closest(".tab");
  if (tab && tab.dataset.id) selectTab(tab.dataset.id);
});

// Roving tabindex: arrow keys move between tabs, as a tablist should.
$("tabs").addEventListener("keydown", (event) => {
  const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
  if (!step) return;
  event.preventDefault();
  const ids = config.frameworks.map((f) => f.id);
  const next = ids[(ids.indexOf(active) + step + ids.length) % ids.length];
  selectTab(next);
  $("tabs").querySelector(`.tab[data-id="${next}"]`).focus();
});

window.addEventListener("resize", () => { if (config) moveIndicator(); });

/* --- the panel under the active tab -------------------------------------- */

function renderPanel() {
  const s = state(active);
  const label = config.frameworks.find((f) => f.id === active).full_name;

  if (s.busy) {
    $("panelbody").innerHTML =
      `<p class="empty enter"><span class="spinner"></span>&nbsp;&nbsp;${esc(label)} is working…
       <br><span class="muted">The first run loads the PII model, so give it a moment.</span></p>`;
    return;
  }
  if (!s.result) {
    $("panelbody").innerHTML = `<div class="empty enter">
      <p style="margin-top:0"><strong>${esc(label)}</strong> hasn't run yet.</p>
      <p style="margin-bottom:0">Fill in the form and press <strong>Onboard</strong>. It validates the
      record, checks for a duplicate, registers the customer and writes the mail — then you can ask
      questions about it. Switch tabs to run the same input through a different framework.</p>
      ${s.error ? `<p class="err">${esc(s.error)}</p>` : ""}
    </div>`;
    return;
  }
  $("panelbody").innerHTML = resultMarkup(s.result) + chatMarkup(s);
  bindChat();
  const log = $("log");
  if (log) log.scrollTop = log.scrollHeight;
}

const MARKS = { registered: "✓", duplicate: "!", blocked: "×" };

function resultMarkup(r) {
  const chips = [
    `${r.llm_calls} model call${r.llm_calls === 1 ? "" : "s"}`,
    `${r.duration_ms} ms`,
    `risk ${esc(r.risk_band)}`,
  ];
  if (r.pii_entity_types.length) chips.push(`masked ${esc(r.pii_entity_types.join(", "))}`);

  let html = `<div class="enter" data-outcome="${esc(r.outcome)}">
    <div class="verdict">
      <span class="mark">${MARKS[r.outcome] || "•"}</span>
      <div>
        <h2>${esc(r.headline)}</h2>
        <div class="sub">${esc(r.company_name)} · ${esc(r.contact_name)} · ${esc(r.plan)} plan ·
          <span style="font-family:var(--mono)">${esc(r.record_id)}</span></div>
      </div>
    </div>
    <div class="chips">
      ${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}
      ${r.injection_signals.map((s) => `<span class="chip alert">${esc(s)}</span>`).join("")}
    </div>`;

  const rows = [
    ...r.findings.map((f) => `<span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>
      <span class="code">${esc(f.code)}</span> ${esc(f.message)}`),
    ...r.escalation_queue.map((e) => `<span class="sev info">stopped</span>${esc(e)}`),
  ];
  if (rows.length) {
    html += `<ul class="plain" style="margin-top:14px">${
      rows.map((row) => `<li>${row}</li>`).join("")}</ul>`;
  }
  html += `</div>`;

  if (r.trace.length) {
    const label = config.frameworks.find((f) => f.id === r.framework);
    html += `<div class="section enter"><h3>What ${esc(label ? label.full_name : r.framework)} ran</h3>
      <div class="trace">${r.trace.map((t, i) => `
        ${i ? '<span class="arrow">→</span>' : ""}
        <span class="step" data-kind="${esc(t.kind)}"${t.detail ? ` title="${esc(t.detail)}"` : ""}>
          ${esc(t.name)}<span class="kind">${esc(t.kind)}</span></span>`).join("")}</div>
      <p class="trace-note">${esc(TRACE_NOTE[r.framework] || "")}</p></div>`;
  }

  if (r.mail.length) {
    html += `<div class="section enter"><h3>Mail — ${r.mail.length}</h3>` + r.mail.map((m, i) => `
      <details class="mail"${i === 0 ? " open" : ""}>
        <summary>
          <span>${esc(m.subject)}</span>
          <span class="who">${esc(m.audience)} · ${esc(m.to)}</span>
          <span class="flag ${m.transmitted ? "yes" : "no"}">${m.transmitted ? "sent" : "not sent"}</span>
        </summary>
        <div class="why">${esc(m.reason)}</div>
        <pre>${esc(m.body)}</pre>
      </details>`).join("") + `</div>`;
  }

  if (r.tasks.length) {
    const done = r.tasks.filter((t) => t.status === "completed").length;
    html += `<div class="section enter"><h3>Task list — ${done}/${r.tasks.length} done</h3>
      <ul class="plain">${r.tasks.map((t) => `
        <li><span class="tick ${t.status === "completed" ? "done" : ""}">${
          t.status === "completed" ? "[x]" : "[ ]"}</span>${esc(t.title)}
          <span class="muted"> — ${esc(t.owner_role)}, ${esc(t.priority)}, due in ${t.due_offset_days}d</span>
        </li>`).join("")}</ul></div>`;
  }
  return html;
}

/** Why each framework's trace looks the way it does. */
const TRACE_NOTE = {
  maf: "Typed executors, in the order the workflow's edges routed the record.",
  langgraph: "Graph nodes, in the order the compiled graph entered them.",
  langchain: "Deterministic steps, plus every tool the agent chose for itself — nobody wrote that order down.",
  crew: "Deterministic steps, plus the crew's agents and the task each of them ran.",
};

const SUGGESTIONS = [
  "how many customers are on pro?",
  "how many tasks are done for them?",
  "what is their phone number?",
  "add a customer called Bob",
];

function chatMarkup(s) {
  const turns = s.turns.map((t) => `
    <div class="turn">
      <div class="q">${esc(t.question)}</div>
      <div class="a${t.pending ? " muted" : ""}">${t.pending ? "…" : esc(t.answer)}</div>
      ${t.tool_calls && t.tool_calls.length ? `<div class="tools">${esc(t.tool_calls.join(" · "))}</div>` : ""}
    </div>`).join("");

  return `<div class="section enter">
    <h3>Ask about the customers</h3>
    <div id="log">${turns || `<p class="empty" style="margin:0">Read-only, over the customer
      registry and each customer's task list — and it is never given a phone number.</p>`}</div>
    <form class="ask" id="ask">
      <input id="question" placeholder="Ask a question…" autocomplete="off" aria-label="Question">
      <button type="submit">Ask</button>
    </form>
    <div class="suggest">${SUGGESTIONS.map((q) =>
      `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    ${s.error ? `<p class="err">${esc(s.error)}</p>` : ""}
  </div>`;
}

/* --- actions -------------------------------------------------------------- */

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const id = active;
  const s = state(id);
  s.busy = true; s.error = ""; $("form-error").textContent = "";
  $("submit").disabled = true;
  renderPanel();

  try {
    const payload = Object.fromEntries(new FormData($("form")).entries());
    payload.framework = id;
    const result = await api("/api/onboard", payload);
    s.result = result;
    s.session = result.session_id;
    s.turns = [];
  } catch (error) {
    s.error = error.message;
    if (id === active) $("form-error").textContent = error.message;
  } finally {
    s.busy = false;
    $("submit").disabled = false;
    renderTabs();
    if (id === active) renderPanel();
    refreshStats();
  }
});

function bindChat() {
  const form = $("ask");
  if (!form) return;
  form.addEventListener("submit", (event) => { event.preventDefault(); ask($("question").value); });
  document.querySelectorAll(".suggest button").forEach((b) =>
    b.addEventListener("click", () => ask(b.dataset.q)));
}

async function ask(question) {
  question = (question || "").trim();
  const id = active;
  const s = state(id);
  if (!question || !s.session) return;

  const turn = { question, answer: "", tool_calls: [], pending: true };
  s.turns.push(turn);
  s.error = "";
  renderPanel();

  try {
    const reply = await api("/api/chat", { session_id: s.session, question });
    turn.answer = reply.answer;
    turn.tool_calls = reply.tool_calls;
  } catch (error) {
    s.turns.pop();
    s.error = error.message;
  } finally {
    turn.pending = false;
    if (id === active) renderPanel();
  }
}

boot().catch((error) => {
  $("status").innerHTML = `<span class="pill off">${esc(error.message)}</span>`;
});
</script>
